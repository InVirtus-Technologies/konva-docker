name: Publish Docker Image

on:
  push:
    tags:
      - "v*.*.*"
  # Allow manual trigger from the Actions UI
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.2.3)"
        required: true
        default: "v1.0.0"

env:
  DOCKERHUB_IMAGE: invirtus/konva

jobs:
  publish:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # ── QEMU for multi-arch builds ─────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to Docker Hub ────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Extract metadata — tags & labels for BOTH registries ──────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # List both images: the action generates tags for each
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            # e.g. tag v1.2.3  →  1.2.3 / 1.2 / 1 / latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=invirtus/konva
            org.opencontainers.image.description=Konva.js server-side rendering microservice
            org.opencontainers.image.licenses=MIT

      # ── Build & Push to both registries in one shot ───────────────────────
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
