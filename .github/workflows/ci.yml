name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Lint & audit
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps (skip canvas native build)
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # ──────────────────────────────────────────────────────────────────────────
  # Docker build (validate the image builds correctly)
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load into local daemon for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: invirtus/konva:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test
        run: |
          docker run -d --name konva-test \
            --read-only \
            --tmpfs /tmp \
            --user 1000:1000 \
            -p 3000:3000 \
            invirtus/konva:ci

          # Wait for the server to be ready
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/healthz; then
              echo "Server is up"
              break
            fi
            sleep 1
          done

          # Health check
          curl -sf http://localhost:3000/healthz | grep '"ok"'
          curl -sf http://localhost:3000/readyz  | grep '"ready"'

          # Render test (basic stage)
          HTTP_CODE=$(curl -s -o /tmp/result.png -w "%{http_code}" \
            -X POST http://localhost:3000/render \
            -H 'Content-Type: application/json' \
            -d @example-payload.json)

          echo "Render HTTP code: $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || (echo "Expected 200, got $HTTP_CODE" && exit 1)

          # Verify output is a valid PNG (magic bytes: 89 50 4E 47)
          file /tmp/result.png | grep -i 'PNG'

          docker stop konva-test
