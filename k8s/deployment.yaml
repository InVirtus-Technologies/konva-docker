apiVersion: apps/v1
kind: Deployment
metadata:
  name: konva-renderer
  labels:
    app: konva-renderer
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: konva-renderer
  template:
    metadata:
      labels:
        app: konva-renderer
    spec:
      # ----------------------------------------------------------------
      # Security: rootless pod
      # ----------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000        # "node" user from node:20 image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # No service-account token projected into the pod
      automountServiceAccountToken: false

      containers:
        - name: konva-renderer
          # Replace with your registry, e.g.:
          # image: registry.example.com/konva-renderer:1.0.0
          image: konva-renderer:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "info"
            # Increase if you send large Konva stages
            - name: BODY_LIMIT
              value: "10mb"

          # ---------------------------------------------------------------
          # Security context per-container
          # ---------------------------------------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # ---------------------------------------------------------------
          # Resources: tune for your workload
          # ---------------------------------------------------------------
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          # ---------------------------------------------------------------
          # Probes
          # ---------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3

          # ---------------------------------------------------------------
          # Volumes: needed because readOnlyRootFilesystem=true
          # node-canvas may need to write temp files
          # ---------------------------------------------------------------
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # Spread across nodes for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: konva-renderer
